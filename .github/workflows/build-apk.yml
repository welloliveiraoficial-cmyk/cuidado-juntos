name: Gerar APK - Cuidado Juntos

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Construir APK Android
    runs-on: ubuntu-latest

    steps:

      # 1. Baixar o código
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Instalar dependências
      - name: Instalar dependências
        run: npm install

      # 4. Preparar pasta do aplicativo web
      - name: Preparar aplicativo web
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp style.css www/
          cp script.js www/
          cp native-notifications.js www/

          cp -r img www/

      # 5. Criar projeto Android
      - name: Adicionar Android
        run: npx cap add android

      # 6. Sincronizar Capacitor
      - name: Sincronizar Capacitor
        run: npx cap sync android

      # 7. Preparar logo
      - name: Preparar logo
        run: |
          mkdir -p assets
          cp img/logo.png assets/logo.png

      # 8. Gerar ícones Android
      - name: Gerar ícones Android
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor "#2563eb" \
            --splashBackgroundColor "#2563eb"

      # 9. Sincronizar novamente
      - name: Sincronizar depois dos ícones
        run: npx cap sync android

      # 10. Preparar ícone das notificações
      - name: Preparar ícone de notificação
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp img/notificacao.png \
            android/app/src/main/res/drawable/notificacao.png

      # 11. Adicionar permissão de notificações
      - name: Adicionar permissão POST_NOTIFICATIONS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          texto = manifest.read_text()

          permissao = (
              '    <uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if "android.permission.POST_NOTIFICATIONS" not in texto:
              marcador = "</manifest>"

              if marcador not in texto:
                  raise SystemExit(
                      "AndroidManifest.xml não possui </manifest>"
                  )

              texto = texto.replace(
                  marcador,
                  permissao + "\n" + marcador
              )

          manifest.write_text(texto)

          print("Permissão POST_NOTIFICATIONS configurada.")
          PY

      # 12. Mostrar o Manifest para diagnóstico
      - name: Verificar AndroidManifest
        run: |
          echo "===== ANDROID MANIFEST ====="
          cat android/app/src/main/AndroidManifest.xml
          echo "===== FIM MANIFEST ====="

      # 13. Permitir execução do Gradle
      - name: Permitir Gradle
        run: chmod +x android/gradlew

      # 14. Gerar APK
      - name: Gerar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug

      # 15. Publicar APK
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: cuidado-juntos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
