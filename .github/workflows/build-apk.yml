name: Gerar APK - Cuidado Juntos

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build-apk:

    name: Construir APK Android

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. BAIXAR CÓDIGO
      # =====================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # =====================================================
      # 2. CONFIGURAR NODE.JS
      # =====================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22
          cache: npm


      # =====================================================
      # 3. CONFIGURAR JAVA
      # =====================================================

      - name: Configurar Java 21
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "21"


      # =====================================================
      # 4. VERIFICAR AMBIENTE
      # =====================================================

      - name: Verificar ambiente
        run: |
          echo "===== NODE ====="
          node --version

          echo "===== NPM ====="
          npm --version

          echo "===== JAVA ====="
          java -version


      # =====================================================
      # 5. INSTALAR DEPENDÊNCIAS
      # =====================================================

      - name: Instalar dependências
        run: npm install


      # =====================================================
      # 6. PREPARAR APLICATIVO WEB
      # =====================================================

      - name: Preparar aplicativo web
        run: |
          echo "Preparando pasta www..."

          rm -rf www

          mkdir -p www

          cp index.html www/
          cp style.css www/
          cp script.js www/
          cp native-notifications.js www/

          cp -r img www/

          echo "Arquivos copiados:"
          find www -maxdepth 2 -type f


      # =====================================================
      # 7. ADICIONAR ANDROID
      # =====================================================

      - name: Adicionar projeto Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Projeto Android já existe."
          fi


      # =====================================================
      # 8. PREPARAR ASSETS
      # =====================================================

      - name: Preparar assets do aplicativo
        run: |
          mkdir -p assets

          cp img/logo.png assets/logo.png

          echo "Logo encontrada:"
          file assets/logo.png


      # =====================================================
      # 9. GERAR ÍCONE E SPLASH SCREEN
      # =====================================================

      - name: Gerar ícones e Splash Screen
        run: |
          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor "#2563eb" \
            --splashBackgroundColor "#2563eb"


      # =====================================================
      # 10. SINCRONIZAR CAPACITOR
      # =====================================================

      - name: Sincronizar Capacitor
        run: |
          npx cap sync android


      # =====================================================
      # 11. PREPARAR ÍCONE DAS NOTIFICAÇÕES
      # =====================================================

      - name: Preparar ícone de notificação
        run: |

          mkdir -p \
            android/app/src/main/res/drawable

          cp img/notificacao.png \
            android/app/src/main/res/drawable/notificacao.png

          echo "Ícone de notificação instalado."


      # =====================================================
      # 12. CONFIGURAR PERMISSÃO DE NOTIFICAÇÕES
      # =====================================================

      - name: Configurar POST_NOTIFICATIONS
        run: |

          python3 - <<'PY'

          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          texto = manifest.read_text()

          permissao = (
              '    <uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if "android.permission.POST_NOTIFICATIONS" not in texto:

              marcador = "</manifest>"

              if marcador not in texto:
                  raise SystemExit(
                      "AndroidManifest.xml não possui </manifest>"
                  )

              texto = texto.replace(
                  marcador,
                  permissao + "\n" + marcador
              )

              manifest.write_text(texto)

          print(
              "Permissão POST_NOTIFICATIONS configurada."
          )

          PY


      # =====================================================
      # 13. VERIFICAR CONFIGURAÇÃO
      # =====================================================

      - name: Verificar configuração Android
        run: |

          echo "======================================"
          echo "ANDROID MANIFEST"
          echo "======================================"

          cat android/app/src/main/AndroidManifest.xml

          echo "======================================"
          echo "CAPACITOR CONFIG"
          echo "======================================"

          cat capacitor.config.json


      # =====================================================
      # 14. DAR PERMISSÃO AO GRADLE
      # =====================================================

      - name: Permitir execução do Gradle
        run: |

          chmod +x android/gradlew


      # =====================================================
      # 15. LIMPAR BUILD ANTERIOR
      # =====================================================

      - name: Limpar projeto Android
        working-directory: android
        run: |

          ./gradlew clean


      # =====================================================
      # 16. GERAR APK
      # =====================================================

      - name: Gerar APK Debug
        working-directory: android
        run: |

          ./gradlew assembleDebug


      # =====================================================
      # 17. VERIFICAR APK
      # =====================================================

      - name: Verificar APK
        run: |

          echo "======================================"
          echo "APK GERADO"
          echo "======================================"

          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk


      # =====================================================
      # 18. PUBLICAR APK
      # =====================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4

        with:
          name: cuidado-juntos-apk

          path:
            android/app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
