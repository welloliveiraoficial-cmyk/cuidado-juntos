name: Gerar APK - Cuidado Juntos

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build-apk:

    name: Construir APK Android

    runs-on: ubuntu-latest


    steps:

      # =====================================================
      # 1. BAIXAR O CÓDIGO
      # =====================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # =====================================================
      # 2. CONFIGURAR NODE.JS
      # =====================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =====================================================
      # 3. CONFIGURAR JAVA
      # =====================================================

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =====================================================
      # 4. VERIFICAR AMBIENTE
      # =====================================================

      - name: Verificar ambiente
        run: |
          echo "===== NODE ====="
          node --version

          echo "===== NPM ====="
          npm --version

          echo "===== JAVA ====="
          java -version


      # =====================================================
      # 5. INSTALAR DEPENDÊNCIAS
      # =====================================================

      - name: Instalar dependências
        run: npm install


      # =====================================================
      # 6. PREPARAR A PASTA WWW
      # =====================================================

      - name: Preparar aplicativo web
        run: |
          echo "Preparando aplicativo..."

          npm run build

          echo ""
          echo "Arquivos preparados:"
          find www -maxdepth 2 -type f


      # =====================================================
      # 7. VERIFICAR LOGO
      # =====================================================

      - name: Verificar arquivos de imagem
        run: |
          echo "===== LOGO ====="

          if [ -f "img/logo.png" ]; then
            echo "Logo encontrada."
            file img/logo.png
          else
            echo "ERRO: img/logo.png não encontrada."
            exit 1
          fi

          echo ""
          echo "===== NOTIFICAÇÃO ====="

          if [ -f "img/icone-notificacao.png" ]; then
            echo "Ícone de notificação encontrado."
            file img/icone-notificacao.png
          else
            echo "ERRO: img/icone-notificacao.png não encontrada."
            exit 1
          fi


      # =====================================================
      # 8. ADICIONAR ANDROID
      # =====================================================

      - name: Adicionar projeto Android
        run: |
          if [ ! -d "android" ]; then
            echo "Criando projeto Android..."
            npx cap add android
          else
            echo "Projeto Android já existe."
          fi


      # =====================================================
      # 9. PREPARAR ASSETS
      # =====================================================

      - name: Preparar assets
        run: |
          mkdir -p assets

          cp img/logo.png assets/logo.png

          echo "Asset da logo preparado."


      # =====================================================
      # 10. GERAR ÍCONE E SPLASH
      # =====================================================

      - name: Gerar ícones e Splash Screen
        run: |
          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor "#2563eb" \
            --splashBackgroundColor "#2563eb"


      # =====================================================
      # 11. SINCRONIZAR CAPACITOR
      # =====================================================

      - name: Sincronizar Capacitor
        run: |
          npx cap sync android


      # =====================================================
      # 12. PREPARAR ÍCONE DE NOTIFICAÇÃO
      # =====================================================

      - name: Preparar ícone de notificação
        run: |

          mkdir -p \
            android/app/src/main/res/drawable

          cp img/icone-notificacao.png \
            android/app/src/main/res/drawable/notificacao.png

          echo "Ícone de notificação instalado."


      # =====================================================
      # 13. COPIAR GOOGLE-SERVICES.JSON
      # =====================================================
      # Baixado do Firebase Console (app Android com pacote
      # com.cuidadojuntos.app) e já commitado na raiz do repo.
      # O plugin do Google Services só o encontra dentro de
      # "android/app/".

      - name: Copiar google-services.json
        run: |
          if [ ! -f "google-services.json" ]; then
            echo "ERRO: google-services.json não encontrado na raiz do repositório."
            exit 1
          fi

          cp google-services.json android/app/google-services.json

          echo "google-services.json copiado para android/app/."


      # =====================================================
      # 14. APLICAR PLUGIN DO GOOGLE SERVICES (GRADLE)
      # =====================================================
      # Necessário para o FCM nativo funcionar de verdade.
      # Se o Capacitor mudar o texto padrão que ele gera nesses
      # arquivos, este passo falha com uma mensagem clara (em
      # vez de aplicar o plugin errado silenciosamente).

      - name: Aplicar plugin do Google Services
        run: |

          python3 - <<'PY'

          from pathlib import Path

          # ---- android/build.gradle (nível do projeto) ----

          build_gradle = Path("android/build.gradle")

          texto = build_gradle.read_text()

          ancora = "classpath 'com.android.tools.build:gradle"

          if ancora not in texto:
              raise SystemExit(
                  "Não encontrei a linha do classpath do Android Gradle "
                  "Plugin em android/build.gradle. O Capacitor deve ter "
                  "mudado o formato do arquivo gerado — cole o conteúdo "
                  "atual desse arquivo na conversa para eu ajustar este "
                  "passo."
              )

          if "com.google.gms:google-services" not in texto:

              linhas = texto.split("\n")

              novas_linhas = []

              for linha in linhas:
                  novas_linhas.append(linha)
                  if ancora in linha:
                      novas_linhas.append(
                          "        classpath 'com.google.gms:google-services:4.4.2'"
                      )

              build_gradle.write_text("\n".join(novas_linhas))

          print("Classpath do Google Services adicionado em android/build.gradle.")

          # ---- android/app/build.gradle (módulo do app) ----

          app_gradle = Path("android/app/build.gradle")

          texto_app = app_gradle.read_text()

          ancora_app = "apply plugin: 'com.android.application'"

          if ancora_app not in texto_app:
              raise SystemExit(
                  "Não encontrei \"apply plugin: 'com.android.application'\" "
                  "em android/app/build.gradle. O Capacitor deve ter mudado "
                  "o formato do arquivo gerado — cole o conteúdo atual desse "
                  "arquivo na conversa para eu ajustar este passo."
              )

          if "com.google.gms.google-services" not in texto_app:

              texto_app = texto_app.replace(
                  ancora_app,
                  ancora_app + "\napply plugin: 'com.google.gms.google-services'"
              )

              app_gradle.write_text(texto_app)

          print("Plugin do Google Services aplicado em android/app/build.gradle.")

          PY


      # =====================================================
      # 15. CONFIGURAR NOTIFICAÇÕES ANDROID
      # =====================================================
      # 1) Permissão de notificações (Android 13+)
      # 2) Ícone/canal padrão que o Android usa pra mostrar
      #    sozinho o aviso "fulano registrou o remédio" quando
      #    o app estiver fechado (ver android.notification em
      #    notificar-registro.js / verificar-atrasos.js, no
      #    repositório cuidado-juntos-api).

      - name: Configurar notificações Android
        run: |

          python3 - <<'PY'

          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          texto = manifest.read_text()

          # ---- Permissão ----

          permissao = (
              '    <uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if "android.permission.POST_NOTIFICATIONS" not in texto:

              marcador = "</manifest>"

              if marcador not in texto:
                  raise SystemExit(
                      "AndroidManifest.xml não possui </manifest>"
                  )

              texto = texto.replace(
                  marcador,
                  permissao + "\n" + marcador
              )

          # ---- Ícone e canal padrão usados quando o FCM mostra
          #      o aviso sozinho, com o app fechado ----

          meta_dados = (
              '        <meta-data\n'
              '            android:name="com.google.firebase.messaging.default_notification_icon"\n'
              '            android:resource="@drawable/notificacao" />\n'
              '        <meta-data\n'
              '            android:name="com.google.firebase.messaging.default_notification_channel_id"\n'
              '            android:value="avisos_familia" />'
          )

          if "default_notification_icon" not in texto:

              marcador_app = "</application>"

              if marcador_app not in texto:
                  raise SystemExit(
                      "AndroidManifest.xml não possui </application>"
                  )

              texto = texto.replace(
                  marcador_app,
                  meta_dados + "\n    " + marcador_app
              )

          manifest.write_text(texto)

          print(
              "Permissão e configuração padrão de notificações prontas."
          )

          PY


      # =====================================================
      # 16. VERIFICAR MANIFEST, GRADLE E GOOGLE-SERVICES
      # =====================================================

      - name: Verificar configuração Android
        run: |

          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          cat android/app/src/main/AndroidManifest.xml

          echo "========================================"
          echo "CAPACITOR CONFIG"
          echo "========================================"

          cat capacitor.config.json

          echo "========================================"
          echo "ANDROID/BUILD.GRADLE (projeto)"
          echo "========================================"

          cat android/build.gradle

          echo "========================================"
          echo "ANDROID/APP/BUILD.GRADLE (app)"
          echo "========================================"

          cat android/app/build.gradle

          echo "========================================"
          echo "GOOGLE-SERVICES.JSON"
          echo "========================================"

          if [ -f "android/app/google-services.json" ]; then
            echo "Presente em android/app/google-services.json."
          else
            echo "ERRO: google-services.json não está em android/app/."
            exit 1
          fi


      # =====================================================
      # 17. USAR CHAVE DE ASSINATURA FIXA
      # =====================================================
      # Sem isso, cada execução do workflow gera uma chave de
      # debug ALEATÓRIA (a máquina do GitHub Actions é nova a
      # cada vez), e o Android recusa "atualizar" o app porque
      # a assinatura mudou — dá erro de "conflito com um
      # pacote já existente". Usando sempre o mesmo arquivo
      # (android-debug.keystore, commitado na raiz do repo),
      # a assinatura fica igual em todo APK gerado a partir de
      # agora, e as atualizações passam a funcionar.

      - name: Usar chave de assinatura fixa
        run: |
          if [ ! -f "android-debug.keystore" ]; then
            echo "ERRO: android-debug.keystore não encontrado na raiz do repositório."
            exit 1
          fi

          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore

          echo "Chave de assinatura fixa instalada."


      # =====================================================
      # 18. PERMITIR EXECUÇÃO DO GRADLE
      # =====================================================

      - name: Permitir execução do Gradle
        run: |

          chmod +x android/gradlew


      # =====================================================
      # 19. LIMPAR BUILD ANTERIOR
      # =====================================================

      - name: Limpar projeto Android
        working-directory: android
        run: |

          ./gradlew clean


      # =====================================================
      # 20. GERAR APK
      # =====================================================

      - name: Gerar APK Debug
        working-directory: android
        run: |

          ./gradlew assembleDebug


      # =====================================================
      # 21. VERIFICAR APK
      # =====================================================

      - name: Verificar APK gerado
        run: |

          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk


      # =====================================================
      # 22. PUBLICAR APK (artefato interno do workflow)
      # =====================================================

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4

        with:
          name: cuidado-juntos-apk

          path: android/app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error


      # =====================================================
      # 23. RENOMEAR APK COM NOME FIXO
      # =====================================================
      # O nome fixo garante que o link de download no site
      # nunca muda, mesmo quando um novo APK é gerado.

      - name: Renomear APK
        run: |
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/cuidado-juntos.apk


      # =====================================================
      # 24. PUBLICAR APK EM UM GITHUB RELEASE
      # =====================================================
      # Isso cria (ou atualiza) um Release chamado "apk-latest"
      # com o APK anexado. Como o Release é público, qualquer
      # pessoa consegue baixar o arquivo direto pelo link,
      # sem precisar de login no GitHub — diferente do artefato
      # do passo 21, que exige estar logado.
      #
      # Link fixo de download (usar no botão do site):
      # https://github.com/welloliveiraoficial-cmyk/cuidado-juntos/releases/latest/download/cuidado-juntos.apk

      - name: Publicar Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Cuidado Juntos — APK Android"
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }}.
            Este Release é atualizado a cada nova versão publicada na branch main.
          make_latest: true
          files: android/app/build/outputs/apk/debug/cuidado-juntos.apk
