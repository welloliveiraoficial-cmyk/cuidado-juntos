name: Verificar atrasos de medicamentos

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de verificação de atrasos
        run: |
          curl -s -X POST "https://cuidado-juntos-api.vercel.app/api/verificar-atrasos" \
            -H "x-api-key: ${{ cj9f8a2b7c1e4d6f0a3b5c8d1e2f4a6b }}"
